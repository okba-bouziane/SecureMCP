services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-kcadmin}
      # Tokens always carry iss=http://localhost:8080/..., whether they were
      # requested from the host or from inside the Docker network.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mcp-server:
    build: .
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_PATH: /app/data/securemcp.db
      KEYCLOAK_ISSUER: http://localhost:8080/realms/securemcp
      # Keys are fetched over the internal Docker network.
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/securemcp/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: mcp-server
    ports:
      - "${MCP_PORT:-3000}:3000"
    volumes:
      - mcp-data:/app/data

volumes:
  mcp-data:
